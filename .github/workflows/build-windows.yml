name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build Windows (portable + NSIS setup + zip)
        working-directory: desktop-app
        run: npm run build:win

      # electron-builder emits platform-default names like `Kuiqr Setup <version>.exe`,
      # `Kuiqr <version>.exe`, and `Kuiqr-<version>-win.zip`. Rename them to the canonical
      # names that pickUpdateAsset and the README download links expect. The Windows filenames
      # embed `package.json` "version" (currently 2.4.1), not `buildVersion`, so glob by
      # shape rather than the version string — this stays correct across any release.
      - name: Rename artifacts to canonical names
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').build.buildVersion")
          cd desktop-app/dist
          # electron-builder's default Windows names embed package.json "version"
          # (2.4.1), not buildVersion, so glob by shape rather than the version string.
          setup=$(ls Kuiqr*Setup*.exe 2>/dev/null | head -1)
          [ -n "$setup" ] && mv "$setup" "Kuiqr-${VERSION}-windows-x64-setup.exe"
          portable=$(ls Kuiqr\ *.exe 2>/dev/null | grep -vi Setup | head -1)
          [ -n "$portable" ] && mv "$portable" "Kuiqr-${VERSION}-windows-x64-portable.exe"
          zip=$(ls Kuiqr-*-win.zip 2>/dev/null | head -1)
          [ -n "$zip" ] && mv "$zip" "Kuiqr-${VERSION}-windows-x64.zip"
          echo "dist contents:"; ls -la
          cd ../..

      - name: Ensure release exists and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').build.buildVersion")
          # Create the release as PUBLISHED (not draft) if it does not already exist.
          # Drafts are invisible to `GET /releases/tags/{tag}`, which the local macOS
          # publisher uses — a draft here caused split releases (v2.4.2.3.7 lost its
          # Windows/Linux assets that way). A published release is found and reused.
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "Kuiqr ${VERSION}" --notes "Kuiqr v${VERSION}" --latest || true
          fi
          # Upload every Windows artifact we produced (setup installer, portable exe, zip).
          for f in desktop-app/dist/Kuiqr-${VERSION}-windows-x64-setup.exe \
                   desktop-app/dist/Kuiqr-${VERSION}-windows-x64-portable.exe \
                   desktop-app/dist/Kuiqr-${VERSION}-windows-x64.zip; do
            [ -e "$f" ] && gh release upload "v${VERSION}" "$f" --clobber
          done
