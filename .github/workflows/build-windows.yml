name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build Windows (portable + NSIS setup + zip)
        working-directory: desktop-app
        run: npm run build:win

      - name: Ensure release exists and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').build.buildVersion")
          # Create the release (as a draft) if it does not already exist, so the
          # upload never fails because the release is missing.
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --draft --title "v${VERSION}" --notes "Kuiqr v${VERSION}" || true
          fi
          # Upload every Windows artifact we produced (setup installer, portable exe, zip).
          for f in desktop-app/dist/Kuiqr-${VERSION}-windows-x64-setup.exe \
                   desktop-app/dist/Kuiqr-${VERSION}-windows-x64-portable.exe \
                   desktop-app/dist/Kuiqr-${VERSION}-windows-x64.zip; do
            [ -e "$f" ] && gh release upload "v${VERSION}" "$f" --clobber
          done
