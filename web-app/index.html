<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Scan QR codes instantly with your camera or by uploading an image. Works on all devices." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kuiqr" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon192.png" />
  <title>Kuiqr — Scan & Open</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Camera Scanner (Full Screen Overlay) ===== -->
  <div id="camera-view" class="camera-view hidden">
    <div class="camera-header">
      <button id="close-camera" class="icon-btn" aria-label="Close camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="camera-title">Scan QR Code</span>
      <button id="switch-camera" class="icon-btn" aria-label="Switch camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
      </button>
    </div>
    <div class="camera-container">
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="camera-canvas" class="hidden"></canvas>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="scan-corner top-left"></div>
          <div class="scan-corner top-right"></div>
          <div class="scan-corner bottom-left"></div>
          <div class="scan-corner bottom-right"></div>
          <div class="scan-line"></div>
        </div>
        <p class="scan-hint">Point your camera at a QR code</p>
      </div>
    </div>
  </div>

  <!-- ===== Main App ===== -->
  <div id="app" class="app">
    <header class="app-header">
      <div class="logo-row">
        <img src="icons/icon192.png" alt="Logo" class="app-logo" />
        <h1>Kuiqr</h1>
      </div>
      <p class="tagline">Scan • Decode • Open</p>
    </header>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="btn-camera" class="btn btn-primary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Scan with Camera</span>
      </button>

      <button id="btn-upload" class="btn btn-secondary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Upload Image</span>
      </button>

      <button id="btn-paste" class="btn btn-secondary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        <span>Paste Image</span>
      </button>

      <input type="file" id="file-input" accept="image/*" hidden />
    </div>

    <!-- Result Card -->
    <div id="result-card" class="result-card hidden">
      <div class="result-header">
        <span id="result-type" class="result-type"></span>
        <button id="copy-result" class="icon-btn-small" title="Copy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <div id="result-data" class="result-data"></div>
      <button id="open-result" class="btn btn-primary btn-open hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>Open in New Tab</span>
      </button>
    </div>

    <!-- Error Message -->
    <div id="error-msg" class="error-msg hidden"></div>

    <!-- History -->
    <div id="history-section" class="history-section">
      <div class="section-header">
        <h2>Recent Scans</h2>
        <button id="clear-history" class="btn-text">Clear</button>
      </div>
      <div id="history-list" class="history-list">
        <p class="empty-state">No scans yet</p>
      </div>
    </div>

    <!-- Install Banner -->
    <div id="install-banner" class="install-banner hidden">
      <div class="install-content">
        <span>Install Kuiqr for quick access</span>
        <button id="install-btn" class="btn-install">Install</button>
      </div>
      <button id="dismiss-install" class="icon-btn-small" aria-label="Dismiss">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <footer class="footer">
      <p>Works on all devices — desktop, iOS &amp; Android</p>
    </footer>
  </div>

  <script src="js/jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
