<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #screenshot-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 1;
    }

    /* Dim layers */
    .dim {
      position: absolute;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 2;
    }

    /* Selection box: white inner border + primary outer outline so it stays
       visible on both dark and light screen content. */
    #selection {
      position: absolute;
      border: 2px solid #fff;
      background: rgba(79, 70, 229, 0.08);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.6), 0 0 30px rgba(79, 70, 229, 0.5);
      z-index: 3;
    }

    /* Hint text: frosted pill with an outline so it never blends into
       the underlying screen content. */
    #hint {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(79, 70, 229, 0.92);
      color: white;
      padding: 12px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      white-space: nowrap;
      z-index: 10;
      transition: opacity 0.2s;
    }

    /* Cancel button: dark frosted circle with a light outline so it stays
       readable over bright or busy screen content. */
    #cancel-btn {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 18px;
      cursor: pointer;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      backdrop-filter: blur(4px);
    }

    #cancel-btn:hover {
      background: rgba(0, 0, 0, 0.75);
    }

    /* Result badge */
    #badge {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      padding: 16px 36px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(4px);
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    /* Hidden util */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="root">
    <img id="screenshot-img" alt="" />
    <div class="dim" id="dim-top"></div>
    <div class="dim" id="dim-bottom"></div>
    <div class="dim" id="dim-left"></div>
    <div class="dim" id="dim-right"></div>
    <div id="selection"></div>
    <div id="hint">Drag to select the QR code area &middot; Press Esc to cancel</div>
    <button id="cancel-btn">&times;</button>
    <div id="badge" class="hidden"></div>
  </div>

  <canvas id="crop-canvas" style="display:none;"></canvas>

  <!-- jsQR is a UMD build: loading it as a normal script defines window.jsQR -->
  <script src="jsQR.js"></script>
  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const screenshotPath = params.get("screenshot");
      const displayWidth = parseInt(params.get("width"), 10);
      const displayHeight = parseInt(params.get("height"), 10);
      const scaleFactor = parseFloat(params.get("scaleFactor")) || 1;

      const root = document.getElementById("root");
      const img = document.getElementById("screenshot-img");
      const sel = document.getElementById("selection");
      const hint = document.getElementById("hint");
      const cancelBtn = document.getElementById("cancel-btn");
      const badge = document.getElementById("badge");
      const cropCanvas = document.getElementById("crop-canvas");

      const dimTop = document.getElementById("dim-top");
      const dimBottom = document.getElementById("dim-bottom");
      const dimLeft = document.getElementById("dim-left");
      const dimRight = document.getElementById("dim-right");

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Load screenshot — with error handling so we never show a silent black screen
      img.src = "file://" + screenshotPath;
      img.onerror = () => {
        // Screenshot failed to load — show clear error instead of black void
        document.getElementById("root").style.background = "#1e1e2e";
        hint.textContent = "⚠ Screen capture failed — check screen capture permission in Settings";
        hint.style.background = "#dc2626";
        hint.style.opacity = "1";
      };

      // Cancel button
      cancelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        window.overlayAPI.cancel();
      });
      cancelBtn.addEventListener("mousedown", (e) => e.stopPropagation());

      // Escape to cancel
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          window.overlayAPI.cancel();
        }
      });

      // ============================================================
      // Robust QR decode — runs 100% locally (no server, no network).
      //
      // Speed strategy (mirrors the in-app scanner):
      //   1. Instant reject for blank / uniform areas (<< 50 ms).
      //   2. FAST PATH  (~80 ms):  original size + small up/down-scales.
      //   3. MEDIUM PATH (~220 ms): grayscale + contrast + few thresholds.
      //   4. DEEP PATH  (~550 ms): multi-scale threshold+invert sweep.
      //   5. ABSOLUTE CAP (800 ms): never let a bad selection hang the UI.
      // ============================================================
      const DECODER_BUDGET_FAST = 80;
      const DECODER_BUDGET_MEDIUM = 220;
      const DECODER_BUDGET_DEEP = 550;
      const DECODER_BUDGET_ABSOLUTE = 800;

      function robustDecode(image) {
        const origW = image.width;
        const origH = image.height;
        const start = performance.now();

        // Guard against tiny / degenerate captures.
        if (origW < 50 || origH < 50) return null;

        // Render the image at a given scale with optional transforms and try to
        // decode it. Returns the decoded string, or null.
        function tryAt(scale, opts) {
          opts = opts || {};
          let w = Math.round(origW * scale);
          let h = Math.round(origH * scale);
          if (w > 1000 || h > 1000) {
            const ratio = Math.min(1000 / w, 1000 / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          if (w < 10 || h < 10) return null;

          const c = document.createElement("canvas");
          c.width = w; c.height = h;
          const ctx = c.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(image, 0, 0, w, h);

          const imageData = ctx.getImageData(0, 0, w, h);
          const data = imageData.data;

          // Optional grayscale — skipped on the FAST path so jsQR sees true
          // color (it does its own luminance math and reads better un-grayscaled).
          if (opts.grayscale) {
            for (let i = 0; i < data.length; i += 4) {
              const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
              data[i] = gray; data[i + 1] = gray; data[i + 2] = gray;
            }
          }

          // Contrast stretch (helps low-contrast codes)
          if (opts.contrast) {
            let minG = 255, maxG = 0;
            for (let i = 0; i < data.length; i += 4) {
              if (data[i] < minG) minG = data[i];
              if (data[i] > maxG) maxG = data[i];
            }
            if (maxG > minG) {
              const range = maxG - minG;
              for (let i = 0; i < data.length; i += 4) {
                const v = ((data[i] - minG) / range) * 255;
                data[i] = v; data[i + 1] = v; data[i + 2] = v;
              }
            }
          }

          // Invert (for inverted/negative QR codes)
          if (opts.invert) {
            for (let i = 0; i < data.length; i += 4) {
              data[i] = 255 - data[i]; data[i + 1] = 255 - data[i + 1]; data[i + 2] = 255 - data[i + 2];
            }
          }

          // Binary threshold
          if (opts.threshold && opts.threshold > 0) {
            for (let i = 0; i < data.length; i += 4) {
              const v = data[i] >= opts.threshold ? 255 : 0;
              data[i] = v; data[i + 1] = v; data[i + 2] = v;
            }
          }

          const code = jsQR(data, w, h, { inversionAttempts: "attemptBoth" });
          return (code && code.data) ? code.data : null;
        }

        // Render once at a capped size to both sample for empty/uniform
        // rejection AND run the fast-path decode on the real image.
        let probeW = origW, probeH = origH;
        if (probeW > 1000 || probeH > 1000) {
          const ratio = Math.min(1000 / probeW, 1000 / probeH);
          probeW = Math.round(probeW * ratio);
          probeH = Math.round(probeH * ratio);
        }
        const probeCanvas = document.createElement("canvas");
        probeCanvas.width = probeW; probeCanvas.height = probeH;
        const pctx = probeCanvas.getContext("2d");
        pctx.imageSmoothingEnabled = true;
        pctx.imageSmoothingQuality = "high";
        pctx.drawImage(image, 0, 0, probeW, probeH);
        const probeData = pctx.getImageData(0, 0, probeW, probeH);

        // ── Instant reject: uniform / blank / blurry selections ──
        if (looksEmptyOrUniform(probeData)) return null;

        // ── FAST PATH ──
        // 1. Original size, normal + inverted.
        let result = jsQR(probeData.data, probeW, probeH, { inversionAttempts: "attemptBoth" });
        if (result) return result;

        // 2. Small up-scales help tiny but otherwise clean codes.
        for (const s of [1.5, 2]) {
          if (performance.now() - start > DECODER_BUDGET_FAST) break;
          result = tryAt(s);
          if (result) return result;
        }

        // 3. Quick down-scale for huge captures where the QR is small.
        if (origW > 600 || origH > 600) {
          if (performance.now() - start <= DECODER_BUDGET_FAST) {
            result = tryAt(0.5);
            if (result) return result;
          }
        }

        // ── MEDIUM PATH ──
        // Grayscale + contrast stretch + a few threshold attempts at native size.
        if (performance.now() - start <= DECODER_BUDGET_MEDIUM) {
          result = tryAt(1, { grayscale: true, contrast: true });
          if (result) return result;
          for (const thresh of [100, 128, 160]) {
            if (performance.now() - start > DECODER_BUDGET_MEDIUM) break;
            result = tryAt(1, { grayscale: true, contrast: true, threshold: thresh });
            if (result) return result;
          }
        }

        // ── DEEP PATH ──
        // Only for hard codes: low contrast, color backgrounds, decorative codes.
        // Kept bounded so a bad selection never stalls for seconds.
        const deepScales = [0.75, 1.25, 1.5];
        for (const s of deepScales) {
          if (performance.now() - start > DECODER_BUDGET_DEEP) break;
          result = tryAt(s, { grayscale: true, contrast: true });
          if (result) return result;
          for (const thresh of [80, 110, 140, 170]) {
            if (performance.now() - start > DECODER_BUDGET_DEEP) break;
            result = tryAt(s, { grayscale: true, contrast: true, threshold: thresh });
            if (result) return result;
            result = tryAt(s, { grayscale: true, contrast: true, threshold: thresh, invert: true });
            if (result) return result;
          }
        }

        return null;
      }

      // ── Instant empty-area detection ──
      // Samples pixels on a grid. If almost every sample is the same color
      // (within a small tolerance), the area contains no QR code.
      function looksEmptyOrUniform(imageData) {
        const d = imageData.data;
        const w = imageData.width;
        const h = imageData.height;
        const sampleStep = Math.max(8, Math.floor(Math.min(w, h) / 16));
        let samples = 0;
        let rSum = 0, gSum = 0, bSum = 0;
        let minL = 255, maxL = 0;

        for (let y = 0; y < h; y += sampleStep) {
          for (let x = 0; x < w; x += sampleStep) {
            const i = (y * w + x) * 4;
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;
            rSum += r; gSum += g; bSum += b;
            if (lum < minL) minL = lum;
            if (lum > maxL) maxL = lum;
            samples++;
          }
        }

        if (samples === 0) return true;

        // No meaningful contrast -> empty.
        if (maxL - minL < 18) return true;

        // Very low color variance (e.g. a blank wall / sky).
        const rAvg = rSum / samples;
        const gAvg = gSum / samples;
        const bAvg = bSum / samples;
        let varianceSum = 0;
        for (let y = 0; y < h; y += sampleStep) {
          for (let x = 0; x < w; x += sampleStep) {
            const i = (y * w + x) * 4;
            varianceSum += Math.abs(d[i] - rAvg) + Math.abs(d[i + 1] - gAvg) + Math.abs(d[i + 2] - bAvg);
          }
        }
        const avgVariance = varianceSum / samples;
        if (avgVariance < 12) return true;

        return false;
      }

      // ============================================================
      // Drag-to-select logic
      // ============================================================
      let dragging = false;
      let sx = 0, sy = 0, ex = 0, ey = 0;

      function updateDim() {
        const left = Math.min(sx, ex);
        const top = Math.min(sy, ey);
        const w = Math.abs(ex - sx);
        const h = Math.abs(ey - sy);

        if (w < 2 || h < 2) {
          dimTop.style.cssText = "position:absolute;background:rgba(0,0,0,0.55);pointer-events:none;z-index:2;top:0;left:0;width:100%;height:100%;";
          dimBottom.style.display = "none";
          dimLeft.style.display = "none";
          dimRight.style.display = "none";
          return;
        }

        dimTop.style.cssText = `position:absolute;background:rgba(0,0,0,0.55);pointer-events:none;z-index:2;top:0;left:0;width:100%;height:${top}px;`;
        dimBottom.style.cssText = `position:absolute;background:rgba(0,0,0,0.55);pointer-events:none;z-index:2;top:${top + h}px;left:0;width:100%;height:${Math.max(0, vh - top - h)}px;`;
        dimLeft.style.cssText = `position:absolute;background:rgba(0,0,0,0.55);pointer-events:none;z-index:2;top:${top}px;left:0;width:${left}px;height:${h}px;`;
        dimRight.style.cssText = `position:absolute;background:rgba(0,0,0,0.55);pointer-events:none;z-index:2;top:${top}px;left:${left + w}px;width:${Math.max(0, vw - left - w)}px;height:${h}px;`;
      }

      root.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        dragging = true;
        sx = ex = e.clientX;
        sy = ey = e.clientY;
        sel.style.display = "block";
        hint.style.opacity = "0";
        cancelBtn.style.opacity = "0";
        updateDim();
      });

      root.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        ex = e.clientX;
        ey = e.clientY;
        const left = Math.min(sx, ex);
        const top = Math.min(sy, ey);
        const w = Math.abs(ex - sx);
        const h = Math.abs(ey - sy);
        sel.style.left = left + "px";
        sel.style.top = top + "px";
        sel.style.width = w + "px";
        sel.style.height = h + "px";
        updateDim();
      });

      root.addEventListener("mouseup", async (e) => {
        if (!dragging) return;
        dragging = false;

        const left = Math.min(sx, ex);
        const top = Math.min(sy, ey);
        const w = Math.abs(ex - sx);
        const h = Math.abs(ey - sy);

        if (w < 10 || h < 10) {
          window.overlayAPI.cancel();
          return;
        }

        // Scanning state
        sel.style.borderColor = "#4f46e5";
        hint.style.opacity = "1";
        hint.textContent = "Scanning...";
        hint.style.background = "rgba(79, 70, 229, 0.95)";
        dimTop.style.display = "none";
        dimBottom.style.display = "none";
        dimLeft.style.display = "none";
        dimRight.style.display = "none";

        // Crop the selected region from the full-res screenshot
        const cropW = Math.round(w * scaleFactor);
        const cropH = Math.round(h * scaleFactor);
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const ctx = cropCanvas.getContext("2d");
        ctx.drawImage(
          img,
          Math.round(left * scaleFactor),
          Math.round(top * scaleFactor),
          cropW, cropH,
          0, 0, cropW, cropH
        );

        const croppedDataUrl = cropCanvas.toDataURL("image/png");

        // Decode locally, with a hard 8s failsafe so the overlay can NEVER hang.
        let result = null;
        try {
          const cropImg = new Image();
          const decodePromise = new Promise((resolve) => {
            cropImg.onload = () => {
              try {
                resolve(robustDecode(cropImg));
              } catch (err) {
                resolve(null);
              }
            };
            cropImg.onerror = () => resolve(null);
            cropImg.src = croppedDataUrl;
          });

          result = await Promise.race([
            decodePromise,
            new Promise((resolve) => setTimeout(() => resolve(null), 8000)),
          ]);
        } catch (err) {
          result = null;
        }

        // Hand the result to the main process (open URL / copy / history / notify).
        try {
          await window.overlayAPI.decoded(result);
        } catch (err) { /* main will still close via done() */ }

        showResult(result);

        // Close the overlay shortly after showing the result.
        setTimeout(() => {
          window.overlayAPI.done();
        }, 2000);
      });

      // Initialize full dim
      updateDim();

      // Result badge
      function showResult(result) {
        badge.classList.remove("hidden");

        if (result) {
          const isUrl = /^(https?:\/\/|www\.)/i.test(String(result).trim());
          badge.style.background = "#22c55e";
          badge.textContent = isUrl ? "QR found — opening URL..." : "QR found — copied to clipboard!";
        } else {
          badge.style.background = "#f59e0b";
          badge.textContent = "No QR code found in that area.";
        }

        setTimeout(() => { badge.style.opacity = "0"; }, 1700);
      }
    })();
  </script>
</body>
</html>
